[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unsaid"
version = "0.1.0"
description = "Real-time Indian Sign Language recognition with computer vision and machine learning."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "numpy>=1.26,<3",
    "opencv-python>=4.9,<5",
    "mediapipe>=0.10,<0.11",
    "scikit-learn>=1.4,<2",
    "torch>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
